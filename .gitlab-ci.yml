# This file is a template, and might need editing before it works on your project.
# Full project: https://gitlab.com/pages/brunch
image: node:10.16

before_script:
- apt-get -qq update && apt-get -qq install -y ruby-sass build-essential python3

pages:
  environment: prod
  cache:
    paths:
    - node_modules/

  script:
  - npm ci
  - npm run build
  artifacts:
    paths:
    - public
  only:
  - master
